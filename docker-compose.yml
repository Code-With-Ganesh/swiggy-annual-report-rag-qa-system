services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swiggy-chatbot-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./vector_db:/app/vector_db

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: devops-assignment-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./:/var/jenkins_home/workspace/swiggy-chatbot

volumes:
  jenkins_home:
